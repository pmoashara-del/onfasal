<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zone Wise Checklist | Ashara Mubaraka 1448H</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/zone.css" />
  </head>
  <body class="zone-page">
    <div id="login-overlay" class="login-overlay hidden">
      <div class="login-card">
        <div class="login-header">
          <h1>Admin Sign In</h1>
          <p>Zone-wise implementation checklist</p>
        </div>
        <form id="login-form" class="login-form">
          <label>
            Username
            <input id="username" name="username" type="text" autocomplete="username" placeholder="admin" />
          </label>
          <label>
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" />
          </label>
          <p id="login-error" class="login-error" aria-live="polite"></p>
          <div class="login-actions">
            <button type="submit" class="btn btn-primary">Sign in as admin</button>
            <button type="button" id="cancel-login-btn" class="btn btn-secondary">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div id="app" class="app zone-app-shell">
      <header class="title-bar title-bar--zone">
        <div class="title-bar-brand">
          <strong>Zone Wise Checklist</strong>
          <span>Post Fasal 48 Hour Implementation · Ashara Mubaraka 1448H</span>
        </div>
        <div class="title-bar-actions">
          <a href="index.html" class="btn btn-ghost" style="color:#fff">Home</a>
          <span id="role-badge" class="badge viewer">View only</span>
          <button type="button" id="logout-btn" class="btn btn-ghost hidden" style="color:#fff">Exit admin</button>
        </div>
      </header>

      <div class="zone-toolbar">
        <div class="zone-toolbar-left admin-only hidden">
          <button type="button" id="save-btn" class="btn btn-primary">Save</button>
          <button type="button" id="add-row-btn" class="btn btn-secondary">Add item</button>
          <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
        </div>
        <div class="zone-toolbar-right">
          <button type="button" id="export-btn" class="btn btn-secondary">Export Excel</button>
          <button type="button" id="admin-login-btn" class="btn btn-ghost zone-signin">Sign in as admin</button>
          <span id="save-status" class="save-status"></span>
        </div>
      </div>

      <p id="readonly-banner" class="readonly-banner">
        View-only mode. <strong>Sign in as admin</strong> to update zone assignments, status, and remarks on each card.
      </p>

      <div class="zone-progress-wrap">
        <div class="zone-progress-head">
          <span id="status-count">0 items</span>
          <span id="progress-text">0% complete</span>
        </div>
        <div class="zone-progress-bar">
          <div id="progress-fill" class="zone-progress-fill" style="width: 0%"></div>
        </div>
      </div>

      <div class="zone-filter-bar">
        <label class="zone-filter-label">
          Filter by zone
          <select id="zone-filter" class="zone-filter-select">
            <option value="">All zones</option>
            <option value="ALL ZONES">ALL ZONES</option>
            <option value="CMZ">CMZ</option>
            <option value="MASAKIN">MASAKIN</option>
            <option value="BURHANI">BURHANI</option>
            <option value="HASANJI">HASANJI</option>
            <option value="MHOW">MHOW</option>
            <option value="HAIDRY">HAIDRY</option>
            <option value="NOORANINAGAR">NOORANINAGAR</option>
          </select>
        </label>
      </div>

      <main id="zone-cards" class="zone-cards" aria-label="Zone checklist items"></main>

      <footer class="status-bar status-bar--zone">
        <span id="status-mode">Read-only</span>
        <span id="status-saved">Data saved in this browser</span>
      </footer>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/zone-data.js"></script>
    <script src="js/zone-app.js"></script>
  </body>
</html>
